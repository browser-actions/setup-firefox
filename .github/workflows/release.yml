name: 'release'
on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release

      - name: Dispatch publication from source tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$SOURCE_TAG"
