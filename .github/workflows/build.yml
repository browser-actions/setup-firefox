name: 'build-test'
on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: ./dist/

  test:
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist

      - name: Test default
        uses: ./
        id: test-default
      - name: Test default version
        run: |
          firefox --version
          ${{ steps.test-default.outputs.firefox-path }} --version
      - name: Test latest-beta
        uses: ./
        with:
          firefox-version: latest-beta
        id: test-latest-beta
      - name: Test latest-beta version
        run: |
          firefox --version
          ${{ steps.test-latest-beta.outputs.firefox-path }} --version
      - name: Test 140.0
        uses: ./
        with:
          firefox-version: "140.0"
        id: test-140
      - name: Test 140.0 version
        run: |
          firefox --version
          ${{ steps.test-140.outputs.firefox-path }} --version
      - name: Test devedition-140.0b1
        uses: ./
        with:
          firefox-version: "devedition-140.0b1"
        id: test-devedition-140-0b1
      - name: Test devedition-140.0b1 version
        run: |
          firefox --version
          ${{ steps.test-devedition-140-0b1.outputs.firefox-path }} --version

  test-windows:
    needs: [build]
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist

      - name: Test default
        uses: ./
        id: test-default
      - name: Test default version
        shell: pwsh
        run: |
          firefox --version
          & "${{ steps.test-default.outputs.firefox-path }}" --version
      - name: Test latest-beta
        uses: ./
        with:
          firefox-version: latest-beta
        id: test-latest-beta
      - name: Test latest-beta version
        shell: pwsh
        run: |
          firefox --version
          & "${{ steps.test-latest-beta.outputs.firefox-path }}" --version
      - name: Test 140.0
        uses: ./
        with:
          firefox-version: "140.0"
        id: test-140
      - name: Test 140.0 version
        shell: pwsh
        run: |
          firefox --version
          & "${{ steps.test-140.outputs.firefox-path }}" --version
      - name: Test devedition-140.0b1
        uses: ./
        with:
          firefox-version: "devedition-140.0b1"
        id: test-devedition-140-0b1
      - name: Test devedition-140.0b1 version
        shell: pwsh
        run: |
          firefox --version
          & "${{ steps.test-devedition-140-0b1.outputs.firefox-path }}" --version
