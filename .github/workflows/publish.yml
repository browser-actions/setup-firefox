name: 'publish'
on:
  push:
    tags:
      - 'setup-firefox-v*'

permissions:
  contents: read

concurrency:
  group: publish-built-action
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Derive distribution tags
        id: version
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_TAG" =~ ^setup-firefox-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported source tag: $SOURCE_TAG" >&2
            exit 1
          fi
          echo "tag=${SOURCE_TAG#setup-firefox-}" >> "$GITHUB_OUTPUT"
          echo "major=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist

      - name: Publish built action
        uses: ueokande/publish-built-action@master
        with:
          tag: ${{ steps.version.outputs.tag }}
          floating-tags: ${{ steps.version.outputs.major }}
          paths: |
            index.js
            package.json
            action.yml
            README.md
          create-release: 'true'
          generate-release-notes: 'true'
          sign-commit: 'true'
          sign-tag: 'true'
          gpg-private-key: ${{ secrets.PRIVATE_SIGNING_KEY }}
          author-name: ueokande
          author-email: ueokande@i-beam.org
